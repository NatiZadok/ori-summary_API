services:
  - type: web
    name: ori-school-family-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: WEBTOP_BIO_JSON
        sync: false
      - key: WEBTOP_TOKEN
        sync: false
      - key: WEBTOP_STATE_B64
        sync: false
